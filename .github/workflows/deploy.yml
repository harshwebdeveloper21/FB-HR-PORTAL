name: Build with Docker and Deploy to cPanel via FTP
 
on:
  push:
    branches:
      - main
 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Build Docker Image
        run: |
          docker build -t my-app .
 
      - name: Extract Build Files from Docker
        run: |
          docker create --name temp_container my-app
          docker cp temp_container:/var/www/html ./build_output
          docker rm temp_container
 
      - name: Clean unwanted folders from build_output
        run: |
          rm -rf ./build_output/vendor
          rm -rf ./build_output/.git
          rm -f ./build_output/.gitignore
          rm -f ./build_output/.gitattributes
          rm -f ./build_output/.env
          rm -f ./build_output/.htaccess
          rm -f ./build_output/writable/auto_leave_last_run.txt
 
 
      - name: Deploy to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 72.60.216.54
          username: u573967329.devhrdemo
          password: mHXqn0&d7+
          server-dir: /
          local-dir: ./build_output/
          protocol: ftp       # 🔥 switch to ftp first (stable)
          port: 21
          passive: true   
          exclude: |
            **/.git*
            **/vendor/**
            **/writable/**
            **/writable/auto_leave_last_run.txt
            **/system/**
            **/uploads/**
            **/public/vendors/**
            **/.env*
            **/.htaccess
